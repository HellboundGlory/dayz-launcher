name: Check

# The regression net for ordinary work. `release.yml` only ever runs on a
# version tag, so before this workflow existed nothing verified a commit —
# a build break could sit on `main` until the next release attempt found it.
#
# `paths-ignore: docs/**` mirrors pages.yml's own `paths: docs/**` scoping:
# a change confined to the marketing site can't affect the Rust workspace or
# the frontend, so it has no reason to spend ~2 minutes running fmt/clippy/
# test/tsc across both. A commit that touches anything outside docs/ still
# runs the full suite, mixed commits included.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Windows still gets its own same job so the Windows-only code paths
    # (winreg, window-vibrancy, registry discovery) keep compiling. The Linux
    # equivalent runs in `rust-linux` below.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # Linux half of the Rust check. The workspace now compiles on Linux too, so a
  # future Windows-only change must not silently break the Linux/AppImage build.
  rust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             build-essential             libssl-dev             libayatana-appindicator3-dev             librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      # Matches the typecheck half of `npm run build`. The Vite build itself is
      # covered by the release workflow's `tauri build`.
      - name: Typecheck
        run: npx tsc --noEmit

  repoos:
    # Guards the .ai/ knowledge layer and the CLAUDE.md generated from it.
    # Deliberately a separate job with no dependency on the other two: it can be
    # deleted wholesale without touching the Rust or frontend checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # The RepoOS CLI is zero-dependency, so a shallow clone is the whole
      # install — no npm ci, no lockfile. Not published to npm yet; when it is,
      # this step collapses to `npx repoos@<version>`.
      #
      # PINNED DELIBERATELY. Tracking `main` meant an upstream change could land
      # here with no commit in this repository: a green build goes red for
      # reasons unrelated to whatever triggered it, and the diff you are staring
      # at cannot explain the failure. Bumping this tag is how a RepoOS upgrade
      # arrives — reviewable, and revertable to the previous one.
      #
      # The tag lives in `.repoos-version` and NOWHERE else. `scripts/repoos.mjs`
      # reads the same file, so a local run and this job cannot end up on
      # different CLI versions — that disagreement surfaces as `generate --check`
      # passing on your machine and failing here, with a diff that explains
      # nothing.
      #
      # To upgrade: change `.repoos-version`, run `npm run repoos:generate`,
      # commit both together.
      #
      # Pinning does not remove the need for the upstream to be public; it
      # changes which commit is fetched, not whether it can be fetched. See
      # .ai/memory/lessons/repoos-ci-job-needs-a-public-upstream.md
      - name: Fetch RepoOS CLI
        run: |
          REPOOS_VERSION="$(cat .repoos-version)"
          echo "RepoOS $REPOOS_VERSION"
          git clone --depth 1 --branch "$REPOOS_VERSION" https://github.com/HellboundGlory/repository-operating-system.git "$RUNNER_TEMP/repoos"

      # Catches unfilled template placeholders, tasks pointing at workflows that
      # do not exist, workflows missing Steps/Validation, and a destructive
      # workflow with no Rollback. Warnings never fail the build — only errors.
      - name: Validate the .ai/ layer
        run: node "$RUNNER_TEMP/repoos/cli/bin/repoos.js" validate .

      # CLAUDE.md is GENERATED from .ai/. Hand-editing it recreates exactly the
      # problem RepoOS removes: two sources of truth that quietly diverge.
      # When this fails, the fix is always the same single command —
      #   node <repoos>/cli/bin/repoos.js generate .
      # — which is what makes it fair to block a build on.
      - name: CLAUDE.md is in sync with .ai/
        run: node "$RUNNER_TEMP/repoos/cli/bin/repoos.js" generate . --check
