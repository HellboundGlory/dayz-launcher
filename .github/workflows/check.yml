name: Check

# The regression net for ordinary work. `release.yml` only ever runs on a
# version tag, so before this workflow existed nothing verified a commit —
# a build break could sit on `main` until the next release attempt found it.
on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Windows, not ubuntu: the workspace pulls in winreg and window-vibrancy,
    # and tetra-launch's registry discovery is Windows-only. A Linux runner
    # cannot compile this.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      # Matches the typecheck half of `npm run build`. The Vite build itself is
      # covered by the release workflow's `tauri build`.
      - name: Typecheck
        run: npx tsc --noEmit

  repoos:
    # Guards the .ai/ knowledge layer and the CLAUDE.md generated from it.
    # Deliberately a separate job with no dependency on the other two: it can be
    # deleted wholesale without touching the Rust or frontend checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # The RepoOS CLI is zero-dependency, so a shallow clone is the whole
      # install — no npm ci, no lockfile. Not published to npm yet; when it is,
      # this step collapses to `npx repoos@<version>`.
      #
      # PINNED DELIBERATELY. Tracking `main` meant an upstream change could land
      # here with no commit in this repository: a green build goes red for
      # reasons unrelated to whatever triggered it, and the diff you are staring
      # at cannot explain the failure. Bumping this tag is how a RepoOS upgrade
      # arrives — reviewable, and revertable to the previous one.
      #
      # To upgrade: change the tag, run `repoos generate .`, commit both.
      #
      # Pinning does not remove the need for the upstream to be public; it
      # changes which commit is fetched, not whether it can be fetched. See
      # .ai/memory/lessons/repoos-ci-job-needs-a-public-upstream.md
      - name: Fetch RepoOS CLI
        env:
          REPOOS_VERSION: v1.3.0
        run: git clone --depth 1 --branch "$REPOOS_VERSION" https://github.com/HellboundGlory/repository-operating-system.git "$RUNNER_TEMP/repoos"

      # Catches unfilled template placeholders, tasks pointing at workflows that
      # do not exist, workflows missing Steps/Validation, and a destructive
      # workflow with no Rollback. Warnings never fail the build — only errors.
      - name: Validate the .ai/ layer
        run: node "$RUNNER_TEMP/repoos/cli/bin/repoos.js" validate .

      # CLAUDE.md is GENERATED from .ai/. Hand-editing it recreates exactly the
      # problem RepoOS removes: two sources of truth that quietly diverge.
      # When this fails, the fix is always the same single command —
      #   node <repoos>/cli/bin/repoos.js generate .
      # — which is what makes it fair to block a build on.
      - name: CLAUDE.md is in sync with .ai/
        run: node "$RUNNER_TEMP/repoos/cli/bin/repoos.js" generate . --check
