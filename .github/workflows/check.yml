name: Check

# The regression net for ordinary work. `release.yml` only ever runs on a
# version tag, so before this workflow existed nothing verified a commit —
# a build break could sit on `main` until the next release attempt found it.
#
# `paths-ignore: docs/**` mirrors pages.yml's own `paths: docs/**` scoping:
# a change confined to the marketing site can't affect the Rust workspace or
# the frontend, so it has no reason to spend ~2 minutes running fmt/clippy/
# test/tsc across both. A commit that touches anything outside docs/ still
# runs the full suite, mixed commits included.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Windows still gets its own same job so the Windows-only code paths
    # (winreg, window-vibrancy, registry discovery) keep compiling. The Linux
    # equivalent runs in `rust-linux` below.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # Linux half of the Rust check. The workspace now compiles on Linux too, so a
  # future Windows-only change must not silently break the Linux/AppImage build.
  rust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             build-essential             libssl-dev             libayatana-appindicator3-dev             librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      # T2 (2026-08-29 audit): this used to run only `tsc --noEmit`, on the
      # theory that the release workflow's `tauri build` covers the Vite
      # build itself — true, but that means a broken Vite input (the
      # two-entry index.html/splash.html setup, a bad asset import, a
      # PostCSS failure) was caught for the first time during a release, not
      # in ordinary CI. `npm run build` runs both steps and is well under two
      # seconds.
      - name: Build
        run: npm run build

      # T1 (2026-08-29 audit): there was no frontend test runner or linter at
      # all — `palette.test.ts` locks a WCAG contrast invariant across a hue
      # sweep and ran only when someone remembered to by hand.
      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint
