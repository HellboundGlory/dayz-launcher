name: Check

# docs/ changes can't affect the Rust workspace or the frontend (mirrors pages.yml's docs/** scope).
# A branch push no longer starts a run: its pull request already does, on the same commit, and
# release tags run it through release.yml without a second copy.
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"
  workflow_call:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    uses: ./.github/workflows/rust-check.yml
    with:
      os: ${{ matrix.os }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      - name: Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      # The browser binaries are cached; the OS packages they need are not.
      - name: Install headless Chromium
        if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright-core install chromium-headless-shell

      - name: Save Playwright browsers
        if: steps.playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # A runner image may already carry the packages, so probe first and only
      # pay the apt round when the probe reports one missing.
      - name: Install Chromium system dependencies
        run: |
          npx playwright-core install-deps --dry-run chromium-headless-shell \
            || npx playwright-core install-deps chromium-headless-shell

      - name: UI harness smoke
        run: npm run harness:smoke

      - name: UI harness perf
        run: npm run harness:perf

  # Both installers are started on pull requests and on main only: a branch push
  # stays cheap.
  appimage:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    uses: ./.github/workflows/linux-bundle.yml

  appimage-start:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: appimage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tetra-launcher-appimage
          path: appimage

      # The AppImage leaves GL and font libraries to the host, as a desktop has them.
      - name: Install Xvfb and the host libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libgbm1 \
            libfontconfig1 libfribidi0 libharfbuzz0b

      # Alive after 20 s is the pass: a launcher that cannot start its windows
      # exits within that. The log is where a startup failure explains itself.
      - name: Start the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -uo pipefail
          app=$(find appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          chmod +x "$app"
          setsid xvfb-run -a "$app" > launcher.out 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "The launcher exited within 20 s:"
            cat launcher.out
            log="$HOME/.local/share/com.tetra.launcher"
            ls -la "$log" || true
            cat "$log/tetra-launcher.log" || true
            exit 1
          fi
          kill -- -"$pid"

  nsis-start:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      # The same key as the check job's Rust cache: this build only needs the
      # registry and git deps back, and its profile differs from that job's.
      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ runner.os }}-release

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # No signing key here, so the updater artifacts are off.
      - name: Build the NSIS installer
        shell: bash
        run: npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked

      # Alive after 20 s is the pass: a launcher that cannot start its windows
      # exits within that. The log is where a startup failure explains itself.
      - name: Install and start it
        shell: pwsh
        run: |
          $setup = Get-ChildItem "target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $install = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { Write-Host "Installer failed with exit code $($install.ExitCode)"; exit 1 }
          $exe = "$env:LOCALAPPDATA\Tetra Launcher\tetra-launcher.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          $proc.Refresh()
          if ($proc.HasExited) {
            Write-Host "The launcher exited within 20 s, exit code $($proc.ExitCode):"
            $log = "$env:LOCALAPPDATA\com.tetra.launcher"
            Get-ChildItem $log -ErrorAction SilentlyContinue | Format-Table
            Get-Content "$log\tetra-launcher.log" -ErrorAction SilentlyContinue
            exit 1
          }
          Stop-Process -Id $proc.Id
