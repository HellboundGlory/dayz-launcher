name: Check

# docs/ changes can't affect the Rust workspace or the frontend (mirrors pages.yml's docs/** scope).
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    uses: ./.github/workflows/rust-check.yml
    with:
      os: ${{ matrix.os }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      - name: Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      # The browser binaries are cached; the OS packages they need are not.
      - name: Install headless Chromium
        if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps chromium-headless-shell

      - name: Install Chromium system dependencies
        if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright-core install-deps chromium-headless-shell

      - name: UI harness smoke
        run: npm run harness:smoke
