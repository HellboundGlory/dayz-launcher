name: CodeQL (Rust)

# The Rust scan takes about 8 minutes, so it runs only when Rust changes and weekly.
on:
  push:
    branches: [main]
    paths: ["**/*.rs", "**/Cargo.toml", "Cargo.lock", ".github/workflows/codeql-rust.yml"]
  pull_request:
    branches: [main]
    paths: ["**/*.rs", "**/Cargo.toml", "Cargo.lock", ".github/workflows/codeql-rust.yml"]
  schedule:
    - cron: "34 11 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:rust
