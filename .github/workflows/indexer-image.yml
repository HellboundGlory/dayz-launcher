name: publish-indexer-image

# Builds the tetra-indexer container image and publishes it to GitHub
# Container Registry (ghcr.io/hellboundglory/dayz-launcher). `:latest` is
# refreshed on every release tag; versioned tags track the tag name. Manual
# dispatch rebuilds `:latest` from the current default branch.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  IMAGE: ghcr.io/hellboundglory/dayz-launcher

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          # On a v2.6.0 tag: "latest", "2.6.0". Otherwise just "latest".
          VERSION=""
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          TAGS="${{ env.IMAGE }}:latest"
          if [ -n "$VERSION" ]; then
            TAGS="$TAGS,${{ env.IMAGE }}:$VERSION"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          # amd64 only: the target hosts are x86_64 VPSes, and an emulated
          # arm64 leg compiles the whole Rust workspace under qemu (20-40 min
          # cold). Add linux/arm64 here if an arm64 host ever appears.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
