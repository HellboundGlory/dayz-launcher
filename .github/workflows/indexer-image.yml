name: publish-indexer-image

# Builds the tetra-indexer image and publishes it to ghcr.io. A release tag
# rebuilds only when the indexer, a crate it links, or its Dockerfile changed;
# a manual dispatch always rebuilds :latest from the default branch.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  IMAGE: ghcr.io/hellboundglory/dayz-launcher

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      # A rebuild restarts the live indexer, so a tag rebuilds only when the indexer, a crate it links,
      # or its Dockerfile changed. A dependency change only in Cargo.toml or Cargo.lock needs a dispatch.
      - name: Needs a build?
        id: needed
        run: |
          set -euo pipefail
          build=true
          if [[ "${{ github.event_name }}" == "push" ]]; then
            prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)
            if [[ -n "$prev" ]]; then
              build=false
              paths=$(cargo metadata --format-version 1 --no-deps | jq -r '
                .packages as $p
                | def direct($n): [$p[] | select(.name == $n) | .dependencies[] | select(.path != null and .kind != "dev") | .name];
                def closure($set): ($set + [$set[] | direct(.)[]] | unique) as $next
                                   | if $next == $set then $set else closure($next) end;
                closure(["tetra-indexer"])[] as $n | $p[] | select(.name == $n) | .manifest_path | sub("/Cargo.toml$"; "")' \
                | sed "s|^$PWD/||")
              if ! git diff --quiet "$prev" "$GITHUB_SHA" -- $paths deploy/Dockerfile; then
                build=true
              fi
            fi
            echo "Compared against ${prev:-no previous tag}: build=$build" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.needed.outputs.build == 'true'

      - name: Login to GHCR
        if: steps.needed.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        if: steps.needed.outputs.build == 'true'
        id: meta
        run: |
          VERSION=""
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          TAGS="${{ env.IMAGE }}:latest"
          if [ -n "$VERSION" ]; then
            TAGS="$TAGS,${{ env.IMAGE }}:$VERSION"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.needed.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          # amd64 only: the target hosts are x86_64 VPSes, and an emulated arm64
          # leg compiles the whole Rust workspace under qemu (20-40 min cold).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
