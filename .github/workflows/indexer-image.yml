name: publish-indexer-image

# Builds the tetra-indexer container image and publishes it to GitHub
# Container Registry (ghcr.io/hellboundglory/dayz-launcher). A release tag
# rebuilds only when something baked into the image changed since the previous
# release tag (see the "Needs a build?" step); versioned tags track the tag name.
# Manual dispatch always rebuilds `:latest` from the current default branch.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  IMAGE: ghcr.io/hellboundglory/dayz-launcher

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The live indexer runs :latest under Watchtower, so a needless rebuild is
      # a needless production restart. Workspace-only version bumps in
      # Cargo.toml/Cargo.lock don't count; a real dependency change does, since
      # a third-party crate's checksum line changes with it.
      - name: Needs a build?
        id: needed
        run: |
          set -euo pipefail
          build=true
          if [[ "${{ github.event_name }}" == "push" ]]; then
            prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)
            if [[ -n "$prev" ]]; then
              build=false
              if ! git diff --quiet "$prev" "$GITHUB_SHA" -- \
                  crates/tetra-indexer crates/tetra-index crates/tetra-core \
                  crates/tetra-net crates/tetra-registry deploy/Dockerfile; then
                build=true
              fi
              lock_changes=$(git diff -U0 "$prev" "$GITHUB_SHA" -- Cargo.toml Cargo.lock \
                | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' \
                | grep -vE '^[+-]version = "[^"]*"$' || true)
              if [[ -n "$lock_changes" ]]; then
                build=true
              fi
            fi
            echo "Compared against ${prev:-no previous tag}: build=$build" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.needed.outputs.build == 'true'

      - name: Login to GHCR
        if: steps.needed.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        if: steps.needed.outputs.build == 'true'
        id: meta
        run: |
          # On a v2.6.0 tag: "latest", "2.6.0". Otherwise just "latest".
          VERSION=""
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          TAGS="${{ env.IMAGE }}:latest"
          if [ -n "$VERSION" ]; then
            TAGS="$TAGS,${{ env.IMAGE }}:$VERSION"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.needed.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          # amd64 only: the target hosts are x86_64 VPSes, and an emulated
          # arm64 leg compiles the whole Rust workspace under qemu (20-40 min
          # cold). Add linux/arm64 here if an arm64 host ever appears.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
