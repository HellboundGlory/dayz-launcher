name: Release

# Release ritual: bump the version in package.json + src-tauri/tauri.conf.json
# (kept in lockstep — the updater compares against tauri.conf.json's version),
# commit, tag as vX.Y.Z, then push the tag. That push is this workflow's only
# trigger — nothing here runs on an ordinary commit.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Builds, signs the updater artifacts (TAURI_SIGNING_PRIVATE_KEY*), and
      # creates+publishes the GitHub release with the NSIS installer,
      # signatures, and latest.json attached.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Tetra Launcher ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false

      # tauri-action only uploads the NSIS installer bundle — the portable
      # distribution (raw exe + steam_api64.dll, which tauri build already
      # places side by side in target/release) is packaged separately and
      # uploaded onto the same release the step above just published.
      - name: Package portable build
        shell: pwsh
        run: |
          $dest = "Tetra-Launcher-${{ github.ref_name }}-portable"
          New-Item -ItemType Directory -Path $dest | Out-Null
          Copy-Item "target/release/tetra-launcher.exe" $dest
          Copy-Item "target/release/steam_api64.dll" $dest
          # What makes this copy portable. src-tauri/src/paths.rs looks for this
          # file beside the exe and keeps tetra.db and settings.json in the same
          # folder when it is there; without it a portable copy would silently
          # store its data in per-user app data like an installed one. The
          # launcher only checks that the file exists — the text is for whoever
          # opens it.
          Set-Content -Path "$dest/portable.txt" -Encoding utf8 -Value @(
            "Delete this file to make this copy store its data in",
            "%LOCALAPPDATA%\com.tetra.launcher instead of in this folder."
          )
          Compress-Archive -Path "$dest/*" -DestinationPath "$dest.zip"

      - name: Upload portable build to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "Tetra-Launcher-${{ github.ref_name }}-portable.zip" --clobber

  # Linux (AppImage) half of the release. Full parity with Windows: builds,
  # signs with the SAME cross-platform key (TAURI_SIGNING_PRIVATE_KEY*), and
  # publishes the AppImage + updater artifacts onto the same release that the
  # Windows job created. `needs: release` serialises it AFTER the Windows job so
  # the GitHub release and its Windows latest.json already exist, letting
  # tauri-action merge this platform's entry into latest.json instead of the two
  # jobs racing to clobber each other's file.
  release-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Build the Rust binary first (release): this both produces the binary and
      # emits libsteam_api.so (the Steamworks SDK) under
      # target/release/build/steamworks-sys-*/out for the next step to stage.
      # (the Steamworks SDK) under target/release/build/steamworks-sys-*/out,
      # which the next step stages for linuxdeploy.
      - name: Build Rust binary (release)
        run: cargo build --release --package tetra-launcher

      # linuxdeploy cannot discover libsteam_api.so by itself (it lives in a
      # hashed build dir, not a library path). Stage a copy in a fixed directory
      # and hand it to the bundler through LD_LIBRARY_PATH; without this the
      # AppImage build fails with "Could not find dependency: libsteam_api.so".
      - name: Stage Steamworks library for the bundler
        run: |
          mkdir -p target/steamlib
          find target/release/build -name 'libsteam_api.so' -exec cp {} target/steamlib/ \;

      # AppImage + .deb + .rpm. NO_STRIP is required because linuxdeploy's
      # bundled strip chokes on modern (GCC 14 / .relr.dyn) libraries — the
      # .deb/.rpm targets don't use linuxdeploy at all, but the env var is
      # harmless for them. The rpm bundler is the pure-Rust `rpm` crate
      # (`tauri build --help` lists rpm alongside deb/appimage as a
      # `--bundles` value) — no `rpmbuild` system package needed on the
      # ubuntu-latest runner. tauri-action merges this platform's entry into
      # the same latest.json the Windows job created, so both updaters keep
      # working (.deb/.rpm are not update sources — the updater always
      # fetches the AppImage — they're just extra install formats on the
      # same release).
      #
      # The .deb/.rpm both need libsteam_api.so to actually run once
      # installed: the AppImage gets it bundled by linuxdeploy via
      # LD_LIBRARY_PATH above, but neither package install has such a
      # wrapper. Instead, `bundle.linux.deb.files` /
      # `bundle.linux.rpm.files` in tauri.conf.json both place the same
      # staged copy at /usr/lib/tetra-launcher/, and `src-tauri/build.rs`
      # bakes in a matching RPATH so the installed binary finds it
      # unassisted — verified locally with `ldd` before this was wired in
      # here.
      - name: Build and publish Linux AppImage + .deb + .rpm
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "1"
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/steamlib
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Tetra Launcher ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --bundles appimage,deb,rpm

      # The in-app changelog reads `notes` from latest.json, tauri-action only
      # fills that field from an explicit `releaseBody`, and we deliberately
      # keep the changelog in CHANGELOG.md rather than duplicating it in this
      # workflow. Likewise, tauri-action has no `releaseBody` configured, so
      # the GitHub release page itself gets an auto-generated body (commit
      # list, not a changelog) unless something else sets it. So after the
      # manifest has been written (and the Linux job has merged its platform
      # entry into it), extract the CHANGELOG.md section for this version and
      # push it to BOTH: `latest.json`'s `notes` (re-uploaded) and the GitHub
      # release body itself (`gh release edit`). Without this, either the
      # update dialog or the release page (previously both) shows no real
      # changelog, and someone has to paste it in by hand after every tag.
      #
      # Fails the build if CHANGELOG.md has no `## v<version>` section for
      # this tag — better than silently publishing an empty changelog in two
      # places, which is exactly the failure mode this replaces.
      - name: Publish the changelog to the release and the updater manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"    # e.g. v1.7.0
          rm -f latest.json
          gh release download "$VERSION" -p latest.json -D . --clobber
          python3 - latest.json "${{ github.ref_name }}" <<'PY'
          import json, re, sys
          path, version = sys.argv[1], sys.argv[2][1:]   # strip leading "v"
          data = json.load(open(path))
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          # Split on every "## " heading and keep the one for this version.
          sections = re.split(r"(?m)^## ", changelog)[1:]
          notes = ""
          for s in sections:
              if s.startswith("v" + version):
                  notes = "## " + s.strip()
                  break
          if not notes:
              sys.exit(
                  f"No '## v{version}' section found in CHANGELOG.md — "
                  "add the changelog entry before tagging."
              )
          data["notes"] = notes
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")
          PY
          gh release upload "$VERSION" latest.json --clobber
          gh release edit "$VERSION" --notes-file release-notes.md
