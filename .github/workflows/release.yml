name: Release

# A tag push is the only trigger. Bump the version in package.json,
# src-tauri/tauri.conf.json and the root Cargo.toml together, then tag vX.Y.Z:
# this creates the release as a draft and publishes it once both builds finish.
concurrency:
  group: release-${{ github.ref }}

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # The whole check, both Rust platforms and the frontend: a tag publishes
  # nothing that a branch push would not have been allowed to merge.
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  # Fails a tag in seconds, not after the builds, when CHANGELOG.md has no section for it.
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check CHANGELOG.md has this version
        shell: bash
        run: grep -qE "^## ${GITHUB_REF_NAME//./\\.}([^0-9.]|$)" CHANGELOG.md

  # The tag names the release; the version files name what is inside it. A tag
  # that disagrees publishes a release whose updater manifest points at another
  # version, so it stops here.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches the version files
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          package=$(jq -r .version package.json)
          tauri=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          if [[ "$tag" != "$package" || "$tag" != "$tauri" || "$tag" != "$cargo" ]]; then
            echo "The tag says $tag:"
            echo "  package.json:                $package"
            echo "  src-tauri/tauri.conf.json:   $tauri"
            echo "  Cargo.toml [workspace.package]: $cargo"
            exit 1
          fi

  release:
    needs: [check, changelog, version]
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      # If this is refused, create the draft by hand: gh release create <tag> --draft --verify-tag
      - name: Create the draft release
        id: create
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if ! id=$(gh release view "$TAG" --json databaseId --jq .databaseId 2>/dev/null); then
            id=$(gh api -X POST "repos/$GH_REPO/releases" \
              -f tag_name="$TAG" -f name="Tetra Launcher $TAG" -F draft=true --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Builds and signs the updater artifacts, then uploads them plus latest.json to the draft.
      - name: Build and upload release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked into the binary as the server-index base URL. Unset = the release is Steam-only.
          TETRA_INDEX_URL: ${{ vars.TETRA_INDEX_URL }}
        with:
          releaseId: ${{ steps.create.outputs.id }}
          args: -- --locked

      # tauri-action only uploads the NSIS installer, so the portable build (raw
      # exe + steam_api64.dll, side by side in target/release) is packaged onto the same release.
      - name: Package portable build
        shell: pwsh
        run: |
          $dest = "Tetra-Launcher-${{ github.ref_name }}-portable"
          New-Item -ItemType Directory -Path $dest | Out-Null
          Copy-Item "target/release/tetra-launcher.exe" $dest
          Copy-Item "target/release/steam_api64.dll" $dest
          # src-tauri/src/paths.rs keeps tetra.db and settings.json in this folder
          # when this file sits beside the exe; without it a portable copy would
          # store its data in per-user app data. Only its existence is checked.
          Set-Content -Path "$dest/portable.txt" -Encoding utf8 -Value @(
            "Delete this file to make this copy store its data in",
            "%LOCALAPPDATA%\com.tetra.launcher instead of in this folder."
          )
          Compress-Archive -Path "$dest/*" -DestinationPath "$dest.zip"

      - name: Upload portable build to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "Tetra-Launcher-${{ github.ref_name }}-portable.zip" --clobber

  # Linux half of the release: builds, signs with the same key and uploads onto
  # the same draft. Waits for the Windows job so its latest.json exists and
  # tauri-action merges this platform's entry into it.
  release-linux:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/linux-bundle.yml
    with:
      release-id: ${{ needs.release.outputs.id }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # The in-app changelog reads `notes` from latest.json and the release page needs
  # a body, and the changelog lives in CHANGELOG.md rather than being duplicated
  # here. Fails if CHANGELOG.md has no `## v<version>` section.
  publish:
    needs: [release, release-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish the changelog to the release and the updater manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"    # e.g. v1.7.0
          rm -f latest.json
          gh release download "$VERSION" -p latest.json -D . --clobber
          python3 - latest.json "${{ github.ref_name }}" <<'PY'
          import json, re, sys
          path, version = sys.argv[1], sys.argv[2][1:]   # strip leading "v"
          data = json.load(open(path))
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          # Split on every "## " heading and keep the one for this version.
          sections = re.split(r"(?m)^## ", changelog)[1:]
          notes = ""
          for s in sections:
              if s.startswith("v" + version):
                  notes = "## " + s.strip()
                  break
          if not notes:
              sys.exit(
                  f"No '## v{version}' section found in CHANGELOG.md — "
                  "add the changelog entry before tagging."
              )
          data["notes"] = notes
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")
          PY
          gh release upload "$VERSION" latest.json --clobber
          gh release edit "$VERSION" --notes-file release-notes.md

      # If this is refused by the integration, run the same command by hand.
      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --prerelease=false --latest
