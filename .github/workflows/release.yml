name: Release

# A tag push is the only trigger. Bump the version in package.json,
# src-tauri/tauri.conf.json and the root Cargo.toml together, then tag vX.Y.Z:
# this creates the release as a draft and publishes it once both builds finish.
concurrency:
  group: release-${{ github.ref }}

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # Two calls rather than a matrix so the Windows build waits only for its own check.
  check-windows:
    uses: ./.github/workflows/rust-check.yml
    with:
      os: windows-latest

  check-linux:
    uses: ./.github/workflows/rust-check.yml
    with:
      os: ubuntu-latest

  # Fails a tag in seconds, not after the builds, when CHANGELOG.md has no section for it.
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CHANGELOG.md has this version
        shell: bash
        run: grep -qE "^## ${GITHUB_REF_NAME//./\\.}([^0-9.]|$)" CHANGELOG.md

  release:
    needs: [check-windows, changelog]
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      # If this is refused, create the draft by hand: gh release create <tag> --draft --verify-tag
      - name: Create the draft release
        id: create
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if ! id=$(gh release view "$TAG" --json databaseId --jq .databaseId 2>/dev/null); then
            id=$(gh api -X POST "repos/$GH_REPO/releases" \
              -f tag_name="$TAG" -f name="Tetra Launcher $TAG" -F draft=true --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Builds and signs the updater artifacts, then uploads them plus latest.json to the draft.
      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked into the binary as the server-index base URL. Unset = the release is Steam-only.
          TETRA_INDEX_URL: ${{ vars.TETRA_INDEX_URL }}
        with:
          releaseId: ${{ steps.create.outputs.id }}
          args: -- --locked

      # tauri-action only uploads the NSIS installer, so the portable build (raw
      # exe + steam_api64.dll, side by side in target/release) is packaged onto the same release.
      - name: Package portable build
        shell: pwsh
        run: |
          $dest = "Tetra-Launcher-${{ github.ref_name }}-portable"
          New-Item -ItemType Directory -Path $dest | Out-Null
          Copy-Item "target/release/tetra-launcher.exe" $dest
          Copy-Item "target/release/steam_api64.dll" $dest
          # src-tauri/src/paths.rs keeps tetra.db and settings.json in this folder
          # when this file sits beside the exe; without it a portable copy would
          # store its data in per-user app data. Only its existence is checked.
          Set-Content -Path "$dest/portable.txt" -Encoding utf8 -Value @(
            "Delete this file to make this copy store its data in",
            "%LOCALAPPDATA%\com.tetra.launcher instead of in this folder."
          )
          Compress-Archive -Path "$dest/*" -DestinationPath "$dest.zip"

      - name: Upload portable build to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "Tetra-Launcher-${{ github.ref_name }}-portable.zip" --clobber

  # Linux (AppImage) half of the release: builds, signs with the same key and
  # uploads onto the same draft. Waits for the Windows job so its latest.json
  # exists and tauri-action merges this platform's entry into it.
  release-linux:
    needs: [release, check-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Produces the binary and emits libsteam_api.so (the Steamworks SDK) for the next step to stage.
      - name: Build Rust binary (release)
        run: cargo build --locked --release --package tetra-launcher
        env:
          TETRA_INDEX_URL: ${{ vars.TETRA_INDEX_URL }}

      # linuxdeploy can't find libsteam_api.so in its hashed build dir; stage a copy
      # for LD_LIBRARY_PATH or the AppImage build fails with "Could not find dependency: libsteam_api.so".
      - name: Stage Steamworks library for the bundler
        run: |
          mkdir -p target/steamlib
          find target/release/build -name 'libsteam_api.so' -exec cp {} target/steamlib/ \;

      # NO_STRIP: linuxdeploy's bundled strip chokes on modern (GCC 14 / .relr.dyn)
      # libraries. The .deb/.rpm installs get no linuxdeploy wrapper, so
      # tauri.conf.json's bundle.linux.*.files copy the staged libsteam_api.so to
      # /usr/lib/tetra-launcher/ and src-tauri/build.rs bakes in a matching RPATH.
      - name: Build and publish Linux AppImage + .deb + .rpm
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "1"
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/steamlib
          TETRA_INDEX_URL: ${{ vars.TETRA_INDEX_URL }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          args: --bundles appimage,deb,rpm -- --locked

      # The in-app changelog reads `notes` from latest.json and the release page needs
      # a body, and the changelog lives in CHANGELOG.md rather than being duplicated
      # here. Fails if CHANGELOG.md has no `## v<version>` section.
      - name: Publish the changelog to the release and the updater manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"    # e.g. v1.7.0
          rm -f latest.json
          gh release download "$VERSION" -p latest.json -D . --clobber
          python3 - latest.json "${{ github.ref_name }}" <<'PY'
          import json, re, sys
          path, version = sys.argv[1], sys.argv[2][1:]   # strip leading "v"
          data = json.load(open(path))
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          # Split on every "## " heading and keep the one for this version.
          sections = re.split(r"(?m)^## ", changelog)[1:]
          notes = ""
          for s in sections:
              if s.startswith("v" + version):
                  notes = "## " + s.strip()
                  break
          if not notes:
              sys.exit(
                  f"No '## v{version}' section found in CHANGELOG.md — "
                  "add the changelog entry before tagging."
              )
          data["notes"] = notes
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")
          PY
          gh release upload "$VERSION" latest.json --clobber
          gh release edit "$VERSION" --notes-file release-notes.md

      # If this is refused by the integration, run the same command by hand.
      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --prerelease=false --latest
