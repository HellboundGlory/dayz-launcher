[workspace]
resolver = "2"
members = [
    "crates/tetra-core",
    "crates/tetra-net",
    "crates/tetra-registry",
    "crates/tetra-steam",
    "crates/tetra-launch",
    "crates/tetra-discord",
    "src-tauri",
]

[workspace.package]
version = "2.2.2"
edition = "2021"
rust-version = "1.85"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
steamworks = "0.13"
winreg = "0.52"
discord-rich-presence = "1.1"
percent-encoding = "2"