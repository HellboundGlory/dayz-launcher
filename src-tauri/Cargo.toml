[package]
name = "tetra-launcher"
version = "1.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is kept ahead of its consumer: the `closeToTray` setting already
# exists and "minimise to tray instead of closing" is a tracked backlog item.
tauri = { version = "2", features = ["tray-icon"] }
# Only the plugins something actually calls. `os`, `fs`, `dialog` and `store`
# were registered here (and permissioned in capabilities/default.json) without
# a single call site: settings are read/written by commands::settings through
# std::fs, and path discovery goes through commands::launch, not a file dialog.
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
# Driven entirely from Rust — `save_settings` applies the change and `setup`
# reconciles at startup — so no JS counterpart and no capability entry: the
# permissions only gate the frontend API, which nothing calls.
tauri-plugin-autostart = "2"
# `tauri-plugin-window-state` was here. It writes `.window-state.json` to a
# directory it resolves itself — only the filename is configurable — which put
# one file outside the data root that `src/paths.rs` chooses. Window geometry
# now lives in `settings.json`; see `src/window_state.rs`.
#
# Keeps a second launch from starting a second launcher. Registered before every
# other plugin so the duplicate process dies before it can touch the registry,
# the settings file or Steam.
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tetra-core = { path = "../crates/tetra-core" }
tetra-net = { path = "../crates/tetra-net" }
tetra-registry = { path = "../crates/tetra-registry" }
tetra-steam = { path = "../crates/tetra-steam" }
tetra-launch = { path = "../crates/tetra-launch" }
tetra-discord = { path = "../crates/tetra-discord" }
# Only used for `_exit` on Linux: terminate without glibc's atexit/dlclose pass
# (see `RunEvent::Exit` in lib.rs and the Linux exit-crash note in progress.md).
libc = "0.2"

# Windows/macOS-only acrylic compositing. Linux has no equivalent effect.
[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.5"
