[package]
name = "tetra-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is kept ahead of its consumer: the `closeToTray` setting already
# exists and "minimise to tray instead of closing" is a tracked backlog item.
tauri = { version = "2", features = ["tray-icon"] }
# Only the plugins something actually calls. `os`, `fs` and `store` were
# registered here (and permissioned in capabilities/default.json) without
# a single call site: settings are read/written by commands::settings through
# std::fs.
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
# The first-launch setup modal's Browse button — everywhere else, path
# discovery still goes through commands::launch, not a dialog.
tauri-plugin-dialog = "2"
# Driven entirely from Rust — `save_settings` applies the change and `setup`
# reconciles at startup — so no JS counterpart and no capability entry: the
# permissions only gate the frontend API, which nothing calls.
tauri-plugin-autostart = "2"
# `tauri-plugin-window-state` was here. It writes `.window-state.json` to a
# directory it resolves itself — only the filename is configurable — which put
# one file outside the data root that `src/paths.rs` chooses. Window geometry
# now lives in `settings.json`; see `src/window_state.rs`.
#
# Keeps a second launch from starting a second launcher. Registered before every
# other plugin so the duplicate process dies before it can touch the registry,
# the settings file or Steam.
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# Reading a theme `.zip` for import — validation and staging only, never
# extraction into the themes directory (see `theme::archive`).
zip = { workspace = true }
# Version gates on an imported theme's manifest.
semver = { workspace = true }
# Scans a theme's `styles.css` before it is served (see `theme::css`). The gate
# is a reject-list plus a `url()` check, so tokenizer-level CSS Syntax Level 3
# is all it needs; `lightningcss` has no stable release and ships the minifier
# and transformer this project has no use for.
cssparser = "0.38"
# Decoding a `tetra-theme://` request's asset path (see `theme::protocol`).
percent-encoding = { workspace = true }
# Sniffing an imported theme's raster assets: the first package that carries
# images, so nothing before this needed a decoder. Only the three formats the
# allow-list accepts — the default features would add a dozen more formats and
# rayon on top.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# Sniffing an imported theme's fonts by parsing their real tables (`image`
# does not read fonts). The first package with fonts, hence first use. WOFF2
# is Brotli inside, WOFF is zlib inside, so both need unpacking before
# ttf-parser — which reads sfnt only — can see the tables.
ttf-parser = "0.25.1"
# Only for the WOFF 1.0 container above (zlib per table); already in the tree
# via tetra-indexer.
flate2 = { workspace = true }
# Brotli comes in through tauri-utils, but that is not a promise we can use.
brotli = { version = "8", default-features = false, features = ["std"] }
# Well-formedness and element/attribute inspection for the SVG sniff.
quick-xml = "0.41"
tetra-core = { path = "../crates/tetra-core" }
tetra-net = { path = "../crates/tetra-net" }
tetra-registry = { path = "../crates/tetra-registry" }
tetra-index = { path = "../crates/tetra-index", features = ["client"] }
tetra-steam = { path = "../crates/tetra-steam" }
tetra-launch = { path = "../crates/tetra-launch" }
tetra-discord = { path = "../crates/tetra-discord" }
# Only used for `_exit` on Linux: terminate without glibc's atexit/dlclose pass
# (see `RunEvent::Exit` in lib.rs and the Linux exit-crash note in progress.md).
libc = "0.2"

# Windows/macOS-only acrylic compositing. Linux has no equivalent effect.
[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.5"
