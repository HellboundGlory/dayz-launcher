[package]
name = "tetra-launch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
thiserror.workspace = true

# Windows-only: reads/writes the Windows registry for Steam discovery and the
# `dzsa://` protocol handler. Not present on Linux (which uses libraryfolders.vdf
# and an XDG .desktop entry instead).
[target.'cfg(windows)'.dependencies]
winreg.workspace = true

[lints.rust]
unsafe_code = "forbid"
