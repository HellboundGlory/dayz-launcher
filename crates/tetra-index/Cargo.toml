[package]
name = "tetra-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Types only by default, so the backend can serialise the wire format without
# pulling an HTTP client it doesn't need. The launcher enables `client`.
default = []
client = ["dep:reqwest", "dep:httpdate"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
reqwest = { workspace = true, optional = true }
httpdate = { version = "1.0.3", optional = true }

[dev-dependencies]
tokio = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
