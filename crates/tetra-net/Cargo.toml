[package]
name = "tetra-net"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tetra-core = { path = "../tetra-core" }
thiserror.workspace = true
tokio.workspace = true

# The A2S CLI probe. Lives here rather than in tetra-core because the queries it
# issues are this crate's — tetra-core is parsing only and has no transport.
[[bin]]
name = "tetra-probe"
path = "src/bin/tetra-probe.rs"

[lints.rust]
unsafe_code = "forbid"