<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetra Launcher</title>
    <link rel="icon" type="image/png" href="/tetra-logo.png" />
    <style>
      #splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background: #0b0f17;
        color: #f1f5f9; font-family: "Inter","Segoe UI",system-ui,sans-serif;
        z-index: 9999; transition: opacity 0.3s ease-out;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      .splash-icon { width: 64px; height: 64px; margin-bottom: 12px; }
      .splash-logo { font-size: 24px; font-weight: 700; letter-spacing: 2px; color: #38bdf8; margin-bottom: 8px; }
      .splash-subtitle { font-size: 12px; color: #64748b; margin-bottom: 24px; }
      .splash-spinner { width: 24px; height: 24px; border: 2px solid #1e293b; border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.6s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .splash-status { margin-top: 16px; font-size: 11px; color: #475569; }
    </style>
  </head>
  <body>
    <div id="splash">
      <img class="splash-icon" src="/tetra-logo.png" alt="" draggable="false" />
      <div class="splash-logo">TETRA</div>
      <div class="splash-subtitle">DayZ Standalone Launcher</div>
      <div class="splash-spinner"></div>
      <div class="splash-status" id="splash-status">Starting up...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      const observer = new MutationObserver(() => {
        const root = document.getElementById("root");
        if (root && root.children.length > 0) {
          const splash = document.getElementById("splash");
          if (splash) { splash.classList.add("hide"); setTimeout(() => splash.remove(), 400); }
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById("root"), { childList: true, subtree: true });
      setTimeout(() => {
        const splash = document.getElementById("splash");
        if (splash) { splash.classList.add("hide"); setTimeout(() => splash.remove(), 400); }
      }, 8000);
    </script>
  </body>
</html>
